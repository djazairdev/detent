# Versions and releases with release-please, from the djazairdev project template. Replaces T-141's
# tag-on-bump job.
#
# On every push to main, release-please reads the commits since the last release (the pull request
# titles, in Conventional Commits form) and keeps one pull request open, "chore(main): release
# X.Y.Z": the version bump. It moves package.json, package-lock.json, .claude-plugin/plugin.json and
# REFEREE_VERSION together (SEC-2) and writes CHANGELOG.md. The release checklist is walked on that
# pull request (docs/release-checklist.md), and the ruleset requires CI on it, so it cannot merge red.
# Merging it tags vX.Y.Z and publishes the GitHub release.
#
# release-please opens that pull request with GITHUB_TOKEN, as github-actions[bot], and GitHub holds
# the CI and title runs on a bot's pull request until a maintainer approves them in its merge box.
# Starting them here with workflow_dispatch didn't help: the release pull request stayed blocked
# until its held runs were approved (#27, template 1.5.3).
#
# Spends nothing by construction: no model credential is available here; R-10's spending consent
# lives only in self-build.yml's manual dispatch.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request and release
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tags, releases, the release branch
      issues: write          # labels on the release pull request
      pull-requests: write   # the release pull request
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
