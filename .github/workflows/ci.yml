name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # release.yml starts it on the release pull request

# The jobs only read the repository (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # N-3: supported LTS lines only. Node 20 reached EOL 2026-04-30 and is
        # deliberately absent (PRDR-055).
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run parity:check
      - run: npm run prompts:check
      # PRDR-247: both existed and neither ran anywhere. `tickets:check` caught
      # four real mistakes in one afternoon on a branch it was never gating.
      - run: npm run rules:check
      - run: npm run tickets:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
